<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1083 1100" width="1083" height="1100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1"/>
      <stop offset="35%" style="stop-color:#E8D5A3;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#C9A96E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#A07840;stop-opacity:1"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&amp;family=Cormorant+Garamond:ital,wght@0,300;1,300&amp;display=swap');
    </style>
  </defs>
  <!-- Ornamental top line -->
  <line x1="200" y1="280" x2="883" y2="280" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="541" cy="240" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <line x1="523" y1="240" x2="200" y2="240" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <line x1="559" y1="240" x2="883" y2="240" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <!-- Diamond accent top -->
  <polygon points="541,210 555,240 541,270 527,240" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Main brand wordmark -->
  <text
    x="541"
    y="620"
    text-anchor="middle"
    font-family="'Kaushan Script', 'Dancing Script', cursive"
    font-size="200"
    font-weight="400"
    fill="url(#goldGrad)"
    letter-spacing="4"
  >Lattév</text>

  <!-- Separator line -->
  <line x1="280" y1="660" x2="760" y2="660" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  <circle cx="541" cy="660" r="3" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Sub wordmark -->
  <text
    x="541"
    y="800"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Palatino Linotype', serif"
    font-size="110"
    font-weight="300"
    font-style="italic"
    fill="url(#goldGrad)"
    letter-spacing="28"
  >JOUEL</text>

  <!-- Ornamental bottom line -->
  <line x1="200" y1="840" x2="883" y2="840" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="541" cy="880" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <line x1="523" y1="880" x2="200" y2="880" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <line x1="559" y1="880" x2="883" y2="880" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <!-- Diamond accent bottom -->
  <polygon points="541,850 555,880 541,910 527,880" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- Tagline -->
  <text
    x="541"
    y="980"
    text-anchor="middle"
    font-family="'Cormorant Garamond', serif"
    font-size="36"
    font-weight="300"
    fill="url(#goldGrad)"
    letter-spacing="12"
    opacity="0.75"
  >MAISON · MUMBAI</text>
</svg>
