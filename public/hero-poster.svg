<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#2a1f0e"/>
      <stop offset="100%" style="stop-color:#1a1408"/>
    </radialGradient>
    <linearGradient id="gld" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E"/>
      <stop offset="50%" style="stop-color:#E8D5A3"/>
      <stop offset="100%" style="stop-color:#C9A96E"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <ellipse cx="960" cy="540" rx="600" ry="400" fill="rgba(201,169,110,0.06)"/>
  <!-- Decorative rings -->
  <circle cx="960" cy="540" r="300" fill="none" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <circle cx="960" cy="540" r="220" fill="none" stroke="rgba(201,169,110,0.18)" stroke-width="1"/>
  <circle cx="960" cy="540" r="140" fill="none" stroke="rgba(201,169,110,0.25)" stroke-width="1"/>
  <!-- Text: Lattév Jouel -->
  <text x="960" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-style="italic" font-weight="300" fill="url(#gld)" opacity="0.9">Lattév Jouel</text>
  <text x="960" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="300" letter-spacing="12" fill="rgba(201,169,110,0.65)">FINE CONTEMPORARY JEWELLERY</text>
</svg>
