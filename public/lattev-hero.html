  <style>
    * {

    html,

      width: 100%;
      height: 100vh;

      inset: 0;

      width: 100%;
      height: 100%;

      position: absolute;
      inset: 0;
      z-index: 3;
      align-items: center;
      justify-content: center;
      color: rgba(120, 100, 60, 0.85);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-align: center;
      padding: 2rem;
    }
  </style>

    function fitCameraToPlane() {
      const aspect = container.clientWidth / Math.max(container.clientHeight, 1);
      camera.aspect = aspect;

      const vFov = (camera.fov * Math.PI) / 180;
      const margin = 1.55; // breathing room around the logo
      const halfW = (planeW * margin) / 2;
      const halfH = (planeH * margin) / 2;

      const distForHeight = halfH / Math.tan(vFov / 2);
      const distForWidth = halfW / (Math.tan(vFov / 2) * aspect);

      camera.position.z = Math.max(distForHeight, distForWidth, 4);
      camera.updateProjectionMatrix();
    }

    /* ------------------------------------------------------------------
       Build alpha / displacement / normal maps procedurally in JS from
       the single grayscale mask above — no external map files needed.
    ------------------------------------------------------------------ */
    function boxBlur1D(src, w, h, radius, horizontal) {
      const out = new Float32Array(w * h);
      const size = radius * 2 + 1;
      if (horizontal) {
        for (let y = 0; y < h; y++) {
          const rowOff = y * w;
          let sum = 0;
          for (let k = -radius; k <= radius; k++) {
            const xx = Math.min(w - 1, Math.max(0, k));
            sum += src[rowOff + xx];
          }
          out[rowOff] = sum / size;
          for (let x = 1; x < w; x++) {
            const addX = Math.min(w - 1, x + radius);
            const remX = Math.max(0, x - radius - 1);
            sum += src[rowOff + addX] - src[rowOff + remX];
            out[rowOff + x] = sum / size;
          }
        }
      } else {
        for (let x = 0; x < w; x++) {
          let sum = 0;
          for (let k = -radius; k <= radius; k++) {
            const yy = Math.min(h - 1, Math.max(0, k));
            sum += src[yy * w + x];
          }
          out[x] = sum / size;
          for (let y = 1; y < h; y++) {
            const addY = Math.min(h - 1, y + radius);
            const remY = Math.max(0, y - radius - 1);
            sum += src[addY * w + x] - src[remY * w + x];
            out[y * w + x] = sum / size;
          }
        }
      }
      return out;
    }

    function boxBlur(src, w, h, radius) {
      if (radius <= 0) return src.slice();
      const horizontalPass = boxBlur1D(src, w, h, radius, true);
      return boxBlur1D(horizontalPass, w, h, radius, false);
    }

    function floatArrayToCanvas(arr, w, h) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      const id = ctx.createImageData(w, h);
      for (let i = 0; i < w * h; i++) {
        const v = Math.max(0, Math.min(255, Math.round(arr[i] * 255)));
        id.data[i * 4] = v;
        id.data[i * 4 + 1] = v;
        id.data[i * 4 + 2] = v;
        id.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(id, 0, 0);
      return c;
    }

    function buildNormalMapCanvas(mask, w, h, strength) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      const id = ctx.createImageData(w, h);
      const at = (x, y) => {
        x = Math.max(0, Math.min(w - 1, x));
        y = Math.max(0, Math.min(h - 1, y));
        return mask[y * w + x];
      };
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const tl = at(x - 1, y - 1), t = at(x, y - 1), tr = at(x + 1, y - 1);
          const l = at(x - 1, y), r = at(x + 1, y);
          const bl = at(x - 1, y + 1), b = at(x, y + 1), br = at(x + 1, y + 1);
          const gx = (tr + 2 * r + br) - (tl + 2 * l + bl);
          const gy = (bl + 2 * b + br) - (tl + 2 * t + tr);

          let nx = -gx * strength;
          let ny = -gy * strength;
          let nz = 1.0;
          const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
          nx /= len; ny /= len; nz /= len;

          const idx = (y * w + x) * 4;
          id.data[idx] = Math.round((nx * 0.5 + 0.5) * 255);
          id.data[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
          id.data[idx + 2] = Math.round((nz * 0.5 + 0.5) * 255);
          id.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(id, 0, 0);
      return c;
    }

    function buildTexturesFromMask(img) {
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;

      const srcCanvas = document.createElement('canvas');
      srcCanvas.width = w;
      srcCanvas.height = h;
      const sctx = srcCanvas.getContext('2d');
      sctx.drawImage(img, 0, 0, w, h);
      const src = sctx.getImageData(0, 0, w, h).data;

      const raw = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) {
        raw[i] = src[i * 4] / 255; // mask is already grayscale, R=G=B
      }

      const sharpMask = boxBlur(raw, w, h, 2);   // clean edge for alpha cutout
      const softMask = boxBlur(raw, w, h, 9);    // smooth relief for displacement/normal

      const alphaCanvas = floatArrayToCanvas(sharpMask, w, h);
      const dispCanvas = floatArrayToCanvas(softMask, w, h);
      const normalCanvas = buildNormalMapCanvas(softMask, w, h, 2.4);

      const alphaTex = new THREE.CanvasTexture(alphaCanvas);
      const dispTex = new THREE.CanvasTexture(dispCanvas);
      const normalTex = new THREE.CanvasTexture(normalCanvas);

      [alphaTex, dispTex, normalTex].forEach((t) => {
        t.colorSpace = THREE.NoColorSpace;
        t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
        t.needsUpdate = true;
      });

      return { alphaTex, dispTex, normalTex, aspect: w / h };
    }

    const loader = new THREE.ImageLoader();
    loader.load(
      LOGO_MASK_DATA_URI,
      (img) => {
        const { alphaTex, dispTex, normalTex, aspect } = buildTexturesFromMask(img);

        planeH = 3.2;
        planeW = planeH * aspect;

        const geometry = new THREE.PlaneGeometry(planeW, planeH, 160, 160);

        const material = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(0xe3c27e),        // champagne gold
          metalness: 1.0,
          roughness: 0.19,
          clearcoat: 0.45,
          clearcoatRoughness: 0.25,
          envMapIntensity: 1.4,
          transparent: true,
          alphaTest: 0.02,
          depthWrite: true,
          opacity: prefersReducedMotion ? 1 : 0,
          alphaMap: alphaTex,
          normalMap: normalTex,
          normalScale: new THREE.Vector2(1.3, 1.3),
          displacementMap: dispTex,
          displacementScale: 0.24,
          displacementBias: 0,
          side: THREE.DoubleSide,
        });

        logoMesh = new THREE.Mesh(geometry, material);
        rig.add(logoMesh);

        if (prefersReducedMotion) {
          rig.scale.setScalar(1); // skip the fade/scale entrance for reduced motion
        } else {
          rig.scale.setScalar(0.94);
          revealStart = elapsed;
        }

        fitCameraToPlane();
      },
      undefined,
      () => {
        fallbackEl.style.display = 'flex';
      }
    );

    /* ---------------- Idle float + mouse parallax/tilt ---------------- */
    const mouseTarget = { x: 0, y: 0 };
    const mouseCurrent = { x: 0, y: 0 };

    function onPointerMove(e) {
      const rect = container.getBoundingClientRect();
      mouseTarget.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseTarget.y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
    }
    window.addEventListener('pointermove', onPointerMove, { passive: true });

    // Kept deliberately subtle — a light, restrained drift and tilt reads
    // as considerably more premium than a wide, bouncy swing.
    const floatAmplitude = prefersReducedMotion ? 0 : 0.08;
    const tiltAmplitude = prefersReducedMotion ? 0.04 : 1;
    const REVEAL_DURATION = 1.1; // seconds
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

    function animate() {
      requestAnimationFrame(animate);

      // Frame-rate-independent smoothing: an exponential-decay lerp based
      // on elapsed time rather than a fixed per-frame factor, so the tilt
      // feels identically smooth on a 60Hz and a 120Hz display.
      const delta = Math.min(clock.getDelta(), 0.05);
      elapsed += delta;
      const smoothing = 1 - Math.exp(-4.5 * delta);

      mouseCurrent.x += (mouseTarget.x - mouseCurrent.x) * smoothing;
      mouseCurrent.y += (mouseTarget.y - mouseCurrent.y) * smoothing;

      rig.position.y = Math.sin(elapsed * 0.45) * floatAmplitude;
      rig.rotation.z = Math.sin(elapsed * 0.25) * (prefersReducedMotion ? 0 : 0.01);
      rig.rotation.y = mouseCurrent.x * 0.22 * tiltAmplitude;
      rig.rotation.x = -mouseCurrent.y * 0.14 * tiltAmplitude;

      if (logoMesh && revealStart !== null) {
        const revealT = Math.min((elapsed - revealStart) / REVEAL_DURATION, 1);
        const eased = easeOutCubic(revealT);
        logoMesh.material.opacity = eased;
        rig.scale.setScalar(THREE.MathUtils.lerp(0.94, 1, eased));
      }

      renderer.render(scene, camera);
    }
    animate();

    /* ---------------- Responsive: track the container, not just window ---------------- */
    function handleResize() {
      const w = Math.max(container.clientWidth, 1);
      const h = Math.max(container.clientHeight, 1);
      renderer.setSize(w, h);
      fitCameraToPlane();
    }

    if ('ResizeObserver' in window) {
      new ResizeObserver(handleResize).observe(container);
    } else {
      window.addEventListener('resize', handleResize);
    }
  </script>

</body>

</html>
