[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "RAZORPAY_KEY_SECRET,RAZORPAY_KEY_ID,VITE_RAZORPAY_KEY_ID"
